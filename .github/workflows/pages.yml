name: Deploy playable prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shell-shock-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build -- --base=/shell-shock-chasing-tail/
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual Pages browser voice with real human recording
        run: SHELL_SHOCK_TEST_URL="${{ steps.deployment.outputs.page_url }}?voice=moonshine&v=${{ github.sha }}" node tests/voice-real-smoke.mjs
      - name: Install generated-speech test fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Verify hosted default Whisper with actual WAV through microphone track
        run: SHELL_SHOCK_WHISPER_SITE="${{ steps.deployment.outputs.page_url }}?v=${{ github.sha }}" node tests/whisper-integrated-mic.mjs
      - name: Verify pinned field candidate and write receipt
        env:
          SHELL_SHOCK_SITE: "${{ steps.deployment.outputs.page_url }}?v=${{ github.sha }}"
        run: node scripts/voice-field-campaign.mjs verify
      - name: Preserve voice campaign receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-field-campaign-receipt
          path: artifacts/voice-field-campaign.json
          if-no-files-found: warn
