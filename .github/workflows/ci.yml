name: Build and test
on:
  push:
    branches: [main, 'research/browser-voice-release-gate-20261024', 'research/full-spoken-command-regression-20261025']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - run: npm run build -- --base=/shell-shock-chasing-tail/
      - run: node tests/voice-real-smoke.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak
      - run: VOICE_PHRASE='driver run over that tree' EXPECT_RESPONSE='Tree identified' VOICE_SYNTH='en-us+f3' node tests/voice-full-command.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shell-shock-web-build
          path: |
            dist/
            artifacts/
          if-no-files-found: error
